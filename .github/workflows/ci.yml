# Qualidade, complexidade, segurança e testes. Política e comandos locais: docs/QUALIDADE.md
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Toda segunda às 06:17 UTC: pega vulnerabilidades novas mesmo sem commits.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, formatação e complexidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint e limites de complexidade (ruff check)
        run: ruff check --output-format=github .
      - name: Formatação (ruff format)
        run: ruff format --check --diff .
      - name: Relatório de complexidade (radon, informativo)
        if: always()
        run: |
          {
            echo "### Funções com complexidade ciclomática C ou pior (radon)"
            echo '```'
            radon cc -s -n C --total-average -e "tests/*" .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Segurança do código e das dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Análise estática de segurança (bandit, só achados novos)
        run: bandit -q -r . -x ./.git,./.venv,./venv,./tests -ll -ii -b .github/bandit-baseline.json
      - name: Vulnerabilidades conhecidas nas dependências (pip-audit, informativo)
        if: always()
        run: |
          set +e
          pip-audit -r requirements.txt -r requirements-dev.txt -r requirements-test.txt \
            --no-deps --disable-pip --progress-spinner off -f markdown > pip-audit.md 2> pip-audit.err
          status=$?
          {
            echo "### pip-audit"
            cat pip-audit.md pip-audit.err
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=pip-audit::Há dependências com vulnerabilidades conhecidas. Veja o resumo do job."
          fi

  secrets:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks (versão e checksum fixos)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Varrer todo o histórico
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  tests:
    name: Testes de fumaça (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest
